# Builds the Vite SPA and ships ./dist to the Plesk/IIS site over FTP.
# Mirrors TBS-RecruiterWebApp/.github/workflows/deploy-test.yml.
#
# Required repository secrets:
#   FTP_SERVER     Plesk FTP host, no scheme   e.g. ftp.trainersbysport.app
#   FTP_USERNAME   FTP user for THIS subdomain (chrooted into its docroot)
#   FTP_PASSWORD
# Optional:
#   FTP_SERVER_DIR             remote docroot with trailing slash, default "/"
#   VITE_STRIPE_PUBLISHABLE_KEY  baked into the bundle at build time
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate required secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            [ -z "${!v}" ] && { echo "::error::secret $v is not set (Settings > Secrets and variables > Actions)"; missing=1; }
          done
          [ -z "$missing" ] || exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build   # tsc -b + vite build (production mode -> .env.production) -> dist/
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

      - name: Deploy to Plesk via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          protocol:   ftps
          port:       21
          local-dir:  ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
            App_Data/**
            .user.ini
